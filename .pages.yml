media:
  input: assets/images
  output: /assets/images

content:
  - name: site_content
    label: Site İçeriği
    type: file
    path: data/content.json
    fields:
      - name: site
        label: Genel Site Ayarları
        type: object
        fields:
          - name: title
            label: Site Başlığı
            type: string
          - name: bannerTitle
            label: Üst Bant Başlığı
            type: string
          - name: subtitle
            label: Alt Başlık
            type: string
          - name: author
            label: Yazar Adı
            type: string
          - name: copyright
            label: Telif Hakkı Metni
            type: string
          - name: registrationForm
            label: Kayıt Formu Ayarları
            type: object
            fields:
              - name: label
                label: Buton Etiketi
                type: string
              - name: url
                label: Form Bağlantısı (URL)
                type: string
              - name: embedUrl
                label: Gömülü Form Bağlantısı (Embed URL)
                type: string

      - name: categories
        label: Kategoriler
        type: object
        list: true
        fields:
          - name: id
            label: Kategori Kimliği (ID)
            type: string
          - name: title
            label: Kategori Adı
            type: string
          - name: description
            label: Kategori Açıklaması
            type: rich-text
          - name: icon
            label: Kategori İkonu
            type: string

      - name: articles
        label: Makaleler
        type: object
        list: true
        fields:
          - name: slug
            label: URL Kısa Adı (Slug)
            type: string
          - name: categoryId
            label: Kategori Seçimi
            type: select
            options:
              values:
                - value: turkiye-gercekleri
                  label: Türkiye Gerçekleri
                - value: mega-projelerim
                  label: Mega Projelerim
          - name: title
            label: Makale Başlığı
            type: string
          - name: date
            label: Yayın Tarihi
            type: date
          - name: readingTime
            label: Okuma Süresi
            type: string
          - name: summary
            label: Kısa Özet
            type: rich-text
          - name: coverImage
            label: Kapak Görseli
            type: image
          - name: coverAlt
            label: Kapak Görseli Açıklaması
            type: string
          - name: tags
            label: Etiketler
            type: string
            list: true
          - name: blocks
            label: İçerik Blokları
            type: object
            list: true
            fields:
              - name: type
                label: Blok Türü
                type: select
                options:
                  values:
                    - value: paragraph
                      label: Paragraf
                    - value: heading
                      label: Alt Başlık
                    - value: image
                      label: Görsel
                    - value: youtube
                      label: YouTube Videosu
              - name: text
                label: Metin İçeriği
                type: rich-text
              - name: src
                label: Görsel Dosyası
                type: image
              - name: alt
                label: Görsel Açıklaması
                type: string
              - name: caption
                label: Alt Yazı (Caption)
                type: string
              - name: videoId
                label: YouTube Video ID
                type: string
          - name: references
            label: Kaynakça
            type: object
            list: true
            fields:
              - name: title
                label: Kaynak Başlığı
                type: string
              - name: url
                label: Kaynak Bağlantısı
                type: string
              - name: note
                label: Açıklama / Not
                type: string

      - name: footer
        label: Alt Bilgi (Footer)
        type: object
        fields:
          - name: about
            label: Hakkımda Metni
            type: string
          - name: socials
            label: Sosyal Medya Hesapları
            type: object
            list: true
            fields:
              - name: platform
                label: Platform
                type: select
                options:
                  values:
                    - GitHub
                    - X
                    - YouTube
                    - LinkedIn
                    - Instagram
                    - Session
                    - Telegram
                    - Website
              - name: label
                label: Görünecek İsim
                type: string
              - name: url
                label: Profil Bağlantısı
                type: string
              - name: icon
                label: İkon
                type: string
              - name: qr
                label: QR Kod Gösterilsin mi?
                type: boolean
          - name: contact
            label: İletişim Bilgileri
            type: object
            list: true
            fields:
              - name: type
                label: İletişim Türü
                type: select
                options:
                  values:
                    - value: email
                      label: E-posta
                    - value: session
                      label: Session Adresi
                    - value: location
                      label: Konum
                    - value: phone
                      label: Telefon
                    - value: link
                      label: Web Bağlantısı
              - name: label
                label: İletişim Başlığı
                type: string
              - name: value
                label: İletişim Değeri
                type: string
              - name: href
                label: Tıklanabilir Bağlantı
                type: string
              - name: copyable
                label: Kopyalanabilir Olsun mu?
                type: boolean
              - name: qr
                label: QR Kod Gösterilsin mi?
                type: boolean