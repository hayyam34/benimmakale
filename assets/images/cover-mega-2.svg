<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Jeotermal Sera Kentleri ve Otonom Tarım Havzaları Mimari Diyagramı">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B1911"/>
      <stop offset="100%" stop-color="#142B1E"/>
    </linearGradient>
    <pattern id="grid4" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1E3A2A" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad4)"/>
  <rect width="1200" height="630" fill="url(#grid4)"/>

  <!-- Geodesic Bio-Dome Structures -->
  <g transform="translate(600, 445)">
    <!-- Ground line -->
    <line x1="-510" y1="0" x2="510" y2="0" stroke="#4ADE80" stroke-opacity="0.6" stroke-width="2"/>

    <!-- Center Dome -->
    <path d="M -210 0 A 210 195 0 0 1 210 0 Z" fill="#12261B" fill-opacity="0.88" stroke="#4ADE80" stroke-width="2.5"/>
    <path d="M -140 0 A 140 130 0 0 1 140 0" fill="none" stroke="#1E3A2A" stroke-width="1.5"/>
    <path d="M -70 0 A 70 65 0 0 1 70 0" fill="none" stroke="#84A98C" stroke-opacity="0.45" stroke-width="1.5"/>
    <line x1="0" y1="-195" x2="0" y2="0" stroke="#1E3A2A" stroke-width="1.5"/>
    <line x1="-148" y1="-138" x2="0" y2="0" stroke="#1E3A2A" stroke-width="1.2"/>
    <line x1="148" y1="-138" x2="0" y2="0" stroke="#1E3A2A" stroke-width="1.2"/>

    <!-- Left Dome -->
    <path d="M -450 0 A 130 120 0 0 1 -190 0 Z" fill="#12261B" fill-opacity="0.75" stroke="#84A98C" stroke-width="2"/>
    <line x1="-320" y1="-120" x2="-320" y2="0" stroke="#1E3A2A" stroke-width="1.2"/>

    <!-- Right Dome -->
    <path d="M 190 0 A 130 120 0 0 1 450 0 Z" fill="#12261B" fill-opacity="0.75" stroke="#84A98C" stroke-width="2"/>
    <line x1="320" y1="-120" x2="320" y2="0" stroke="#1E3A2A" stroke-width="1.2"/>

    <!-- Underground Geothermal Loop -->
    <path d="M -320 0 L -320 75 C -320 105, -260 115, 0 115 C 260 115, 320 105, 320 75 L 320 0" fill="none" stroke="#4ADE80" stroke-width="2.5" stroke-dasharray="8 6"/>
    <circle cx="0" cy="115" r="9" fill="#4ADE80"/>
  </g>

  <!-- Title Section -->
  <rect x="72" y="64" width="308" height="36" rx="18" fill="#12261B" stroke="#1E3A2A" stroke-width="1.5"/>
  <circle cx="94" cy="82" r="5" fill="#4ADE80"/>
  <text x="112" y="87" fill="#84A98C" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="1.4">MEGA PROJE KONSEPTİ // #02</text>

  <text x="72" y="152" fill="#E8EFEA" font-family="Georgia, serif" font-size="40" font-weight="700">Jeotermal Sera Kentleri ve</text>
  <text x="72" y="200" fill="#E8EFEA" font-family="Georgia, serif" font-size="40" font-weight="700">Kapalı Devre Tarım Havzaları</text>

  <text x="600" y="596" text-anchor="middle" fill="#A3B8AC" font-family="Inter, Arial, sans-serif" font-size="16">JEOTERMAL ISI DÖNGÜSÜ • %92 SU GERİ KAZANIMI • DİKEY HİDROPONİK ÜRETİM</text>
</svg>
