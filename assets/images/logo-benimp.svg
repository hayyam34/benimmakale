<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Birlik Emek Nizam İlerleme ve Mutluluk Partisi Logosu">
  <defs>
    <radialGradient id="kizilelmaGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="55%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </radialGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="55%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
  </defs>

  <!-- Birlik ve Nizam Çemberi -->
  <circle cx="32" cy="32" r="30" fill="#0E2418" stroke="#4ADE80" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="25" fill="none" stroke="#84A98C" stroke-width="1.1" stroke-opacity="0.5"/>

  <!-- Kızılelma -->
  <g>
    <!-- Sap -->
    <path d="M 32 12.2 C 31.8 9.9, 32.8 8.2, 34.3 7.3" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>
    <!-- Yeşil Yaprak -->
    <path d="M 32.7 10.3 C 35.3 7.9, 38.8 8.1, 39.7 10.5 C 37.5 11.8, 34.6 11.6, 32.7 10.3 Z" fill="#4ADE80"/>
    <!-- Kızıl Elma Gövdesi -->
    <path d="M 32 12.8 C 29.5 11.1, 24.8 11.5, 23.7 15.8 C 22.6 19.9, 25.3 25.3, 29.4 26.0 C 30.9 26.3, 31.5 25.6, 32 25.6 C 32.5 25.6, 33.1 26.3, 34.6 26.0 C 38.7 25.3, 41.4 19.9, 40.3 15.8 C 39.2 11.5, 34.5 11.1, 32 12.8 Z" fill="url(#kizilelmaGrad)" stroke="#FCA5A5" stroke-width="0.6" stroke-opacity="0.55"/>
    <!-- Hafif Işık Parıltısı -->
    <ellipse cx="27.6" cy="16.2" rx="1.5" ry="2.6" transform="rotate(-18 27.6 16.2)" fill="#FEE2E2" fill-opacity="0.45"/>
  </g>

  <!-- Yukarıyı Gösteren Meşale -->
  <g>
    <!-- Dış Alev -->
    <path d="M 32 27.4 C 34.6 30.2, 36.4 32.6, 35.4 35.4 C 34.7 36.6, 33.4 37.2, 32 37.2 C 30.6 37.2, 29.3 36.6, 28.6 35.4 C 27.6 32.6, 29.4 30.2, 32 27.4 Z" fill="url(#flameGrad)"/>
    <!-- İç Parlak Alev -->
    <path d="M 32 30.8 C 33.4 32.5, 34.1 34.1, 33.4 35.8 C 32.9 36.5, 32.4 36.8, 32 36.8 C 31.6 36.8, 31.1 36.5, 30.6 35.8 C 29.9 34.1, 30.6 32.5, 32 30.8 Z" fill="#FEF9C3"/>
    <!-- Meşale Çanağı Üst Bilezik -->
    <rect x="26.5" y="37" width="11" height="2.2" rx="1.1" fill="#E8EFEA"/>
    <!-- Meşale Çanağı Gövde -->
    <path d="M 27.5 39.2 H 36.5 L 34.3 43.2 H 29.7 Z" fill="#D5E3DA"/>
    <line x1="28.6" y1="41" x2="35.4" y2="41" stroke="#84A98C" stroke-width="1"/>
    <!-- Meşale Sapı -->
    <path d="M 30.2 43.2 H 33.8 L 33.1 50.2 H 30.9 Z" fill="#E8EFEA"/>
  </g>

  <!-- Emek: Alt ve Yanlarda Simetrik Başak / Birlik Yaprakları -->
  <g fill="none" stroke="#4ADE80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 16 45 C 13 39, 13 33, 15.5 27.5"/>
    <path d="M 48 45 C 51 39, 51 33, 48.5 27.5"/>
    <path d="M 15.5 42 L 19.5 39.5 M 14.5 36.5 L 19 34 M 15 31 L 19.2 29"/>
    <path d="M 48.5 42 L 44.5 39.5 M 49.5 36.5 L 45 34 M 49 31 L 44.8 29"/>
    <path d="M 20.5 52.2 Q 32 56.5 43.5 52.2" stroke="#84A98C"/>
  </g>
</svg>
