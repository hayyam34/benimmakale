<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Türkiye Su Havzaları ve Topografik Analiz Diyagramı">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1911"/>
      <stop offset="60%" stop-color="#12261B"/>
      <stop offset="100%" stop-color="#0E2016"/>
    </linearGradient>
    <linearGradient id="accentGlow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ADE80" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#4ADE80" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#84A98C" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="areaFill1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0B1911" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E3A2A" stroke-width="0.8" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad1)"/>
  <rect width="1200" height="630" fill="url(#grid1)"/>

  <!-- Topographic contour curves -->
  <g fill="none" stroke="#1E3A2A" stroke-width="1.5">
    <path d="M -50 470 Q 180 390 360 440 T 760 370 T 1250 420"/>
    <path d="M -50 420 Q 200 330 390 385 T 790 320 T 1250 365"/>
    <path d="M -50 370 Q 220 270 420 330 T 820 270 T 1250 310"/>
    <path d="M -50 520 Q 160 450 330 495 T 730 425 T 1250 475"/>
  </g>

  <!-- River basin profile area & highlighted hydro curve -->
  <path d="M 80 480 C 240 410, 320 290, 480 330 C 640 370, 740 210, 920 245 C 1030 265, 1100 190, 1140 165 L 1140 520 L 80 520 Z" fill="url(#areaFill1)"/>
  <path d="M 80 480 C 240 410, 320 290, 480 330 C 640 370, 740 210, 920 245 C 1030 265, 1100 190, 1140 165" fill="none" stroke="url(#accentGlow1)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Basin nodes -->
  <g>
    <circle cx="260" cy="378" r="18" fill="#12261B" stroke="#4ADE80" stroke-width="2"/>
    <circle cx="260" cy="378" r="5" fill="#4ADE80"/>
    <circle cx="480" cy="330" r="22" fill="#12261B" stroke="#84A98C" stroke-width="2"/>
    <circle cx="480" cy="330" r="6" fill="#4ADE80"/>
    <circle cx="775" cy="240" r="26" fill="#12261B" stroke="#4ADE80" stroke-width="2.5"/>
    <circle cx="775" cy="240" r="7" fill="#4ADE80"/>
    <circle cx="1010" cy="245" r="16" fill="#12261B" stroke="#84A98C" stroke-width="2"/>
    <circle cx="1010" cy="245" r="4.5" fill="#E8EFEA"/>
  </g>

  <!-- Vertical indicator lines -->
  <g stroke="#4ADE80" stroke-opacity="0.3" stroke-dasharray="4 6" stroke-width="1.2">
    <line x1="260" y1="396" x2="260" y2="520"/>
    <line x1="480" y1="352" x2="480" y2="520"/>
    <line x1="775" y1="266" x2="775" y2="520"/>
    <line x1="1010" y1="261" x2="1010" y2="520"/>
  </g>

  <!-- HUD Badge & Typography -->
  <rect x="72" y="68" width="248" height="36" rx="18" fill="#12261B" stroke="#1E3A2A" stroke-width="1.5"/>
  <circle cx="94" cy="86" r="5" fill="#4ADE80"/>
  <text x="112" y="91" fill="#84A98C" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="1.4">HİDROLOJİ ANALİZİ // 25 HAVZA</text>

  <text x="72" y="156" fill="#E8EFEA" font-family="Georgia, serif" font-size="42" font-weight="700">Su Stresi ve Havza Dengesi</text>
  <text x="72" y="196" fill="#A3B8AC" font-family="Inter, Arial, sans-serif" font-size="20">Kişi başı kullanılabilir su potansiyeli ve iklim projeksiyonları</text>

  <!-- Bottom metric strip -->
  <g transform="translate(72, 535)">
    <rect width="1056" height="54" rx="10" fill="#12261B" fill-opacity="0.9" stroke="#1E3A2A" stroke-width="1.2"/>
    <text x="28" y="33" fill="#A3B8AC" font-family="Inter, Arial, sans-serif" font-size="15">YILLIK POTANSİYEL: <tspan fill="#4ADE80" font-weight="700">112 MİLYAR m³</tspan></text>
    <text x="390" y="33" fill="#A3B8AC" font-family="Inter, Arial, sans-serif" font-size="15">TARIMSAL KULLANIM: <tspan fill="#E8EFEA" font-weight="700">%74</tspan></text>
    <text x="690" y="33" fill="#A3B8AC" font-family="Inter, Arial, sans-serif" font-size="15">2035 RİSK ENDEKSİ: <tspan fill="#4ADE80" font-weight="700">KRİTİK EŞİK</tspan></text>
  </g>
</svg>
