<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Anadolu Yüksek Hızlı Lojistik ve Enerji Koridoru Teknik Şeması">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1911"/>
      <stop offset="100%" stop-color="#13291D"/>
    </linearGradient>
    <pattern id="hex3" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 0 24 L 48 24 M 24 0 L 24 48" stroke="#1E3A2A" stroke-width="0.9" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad3)"/>
  <rect width="1200" height="630" fill="url(#hex3)"/>

  <!-- High-speed rail & energy transmission twin corridor -->
  <g transform="translate(0, 40)">
    <path d="M 70 360 C 260 360, 320 260, 520 260 C 720 260, 780 330, 960 280 C 1040 255, 1090 220, 1130 210" fill="none" stroke="#1E3A2A" stroke-width="26" stroke-linecap="round"/>
    <path d="M 70 360 C 260 360, 320 260, 520 260 C 720 260, 780 330, 960 280 C 1040 255, 1090 220, 1130 210" fill="none" stroke="#4ADE80" stroke-width="4" stroke-linecap="round"/>
    <path d="M 70 374 C 260 374, 320 274, 520 274 C 720 274, 780 344, 960 294 C 1040 269, 1090 234, 1130 224" fill="none" stroke="#84A98C" stroke-width="2" stroke-dasharray="10 8"/>
  </g>

  <!-- Corridor Hub Stations -->
  <g>
    <g transform="translate(150, 400)">
      <rect x="-56" y="-44" width="112" height="32" rx="6" fill="#12261B" stroke="#1E3A2A"/>
      <text x="0" y="-23" text-anchor="middle" fill="#E8EFEA" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">EGE LİMANI</text>
      <circle cx="0" cy="0" r="11" fill="#0B1911" stroke="#4ADE80" stroke-width="3"/>
    </g>
    <g transform="translate(520, 300)">
      <rect x="-74" y="-48" width="148" height="32" rx="6" fill="#12261B" stroke="#4ADE80"/>
      <text x="0" y="-27" text-anchor="middle" fill="#4ADE80" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">İÇ ANADOLU HUB</text>
      <circle cx="0" cy="0" r="14" fill="#0B1911" stroke="#4ADE80" stroke-width="3.5"/>
    </g>
    <g transform="translate(960, 320)">
      <rect x="-70" y="22" width="140" height="32" rx="6" fill="#12261B" stroke="#1E3A2A"/>
      <text x="0" y="43" text-anchor="middle" fill="#E8EFEA" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">DOĞU ENERJİ ÜSSÜ</text>
      <circle cx="0" cy="0" r="11" fill="#0B1911" stroke="#84A98C" stroke-width="3"/>
    </g>
  </g>

  <!-- Title & Subtitle -->
  <rect x="72" y="64" width="290" height="36" rx="18" fill="#12261B" stroke="#1E3A2A" stroke-width="1.5"/>
  <circle cx="94" cy="82" r="5" fill="#4ADE80"/>
  <text x="112" y="87" fill="#84A98C" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="1.4">MEGA PROJE KONSEPTİ // #01</text>

  <text x="72" y="152" fill="#E8EFEA" font-family="Georgia, serif" font-size="40" font-weight="700">Anadolu Çift Katmanlı</text>
  <text x="72" y="200" fill="#E8EFEA" font-family="Georgia, serif" font-size="40" font-weight="700">Lojistik ve HVDC Enerji Koridoru</text>

  <!-- Specs Boxes -->
  <g transform="translate(72, 500)">
    <rect x="0" y="0" width="330" height="74" rx="10" fill="#12261B" stroke="#1E3A2A" stroke-width="1.5"/>
    <text x="22" y="29" fill="#84A98C" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">RAYLI YÜK HIZI</text>
    <text x="22" y="56" fill="#E8EFEA" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">250 km/s Otonom Mag-Rail</text>

    <rect x="356" y="0" width="330" height="74" rx="10" fill="#12261B" stroke="#1E3A2A" stroke-width="1.5"/>
    <text x="378" y="29" fill="#84A98C" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">GÜNEŞ + RÜZGAR İLETİMİ</text>
    <text x="378" y="56" fill="#4ADE80" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">12 GW Yeraltı HVDC Hat</text>

    <rect x="712" y="0" width="344" height="74" rx="10" fill="#12261B" stroke="#1E3A2A" stroke-width="1.5"/>
    <text x="734" y="29" fill="#84A98C" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">KARBON TASARRUFU</text>
    <text x="734" y="56" fill="#E8EFEA" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">-%68 Karayolu Emisyonu</text>
  </g>
</svg>
