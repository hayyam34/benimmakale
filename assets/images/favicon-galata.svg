  <rect x="25.2" y="41.5" width="3.2" height="4.5" rx="1.6" fill="#12261B"/>
  <rect x="35.6" y="41.5" width="3.2" height="4.5" rx="1.6" fill="#12261B"/>
  <path d="M 29.2 56 V 50.5 A 2.8 2.8 0 0 1 34.8 50.5 V 56 Z" fill="#12261B"/>
