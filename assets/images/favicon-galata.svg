  <rect x="38" y="30.8" width="3" height="4.2" rx="1.5" fill="#0B1911"/>
  <!-- Balkon Çıkıntısı -->
  <rect x="19" y="36" width="26" height="2.4" rx="1" fill="#84A98C"/>
  <!-- Silindirik Kule Gövdesi -->
  <rect x="21.5" y="38.4" width="21" height="17.6" rx="1.2" fill="#E8EFEA"/>
  <rect x="33" y="38.4" width="9.5" height="17.6" fill="#C9D8CE"/>
