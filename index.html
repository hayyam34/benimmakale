<!DOCTYPE html>
<html lang="tr" data-theme="green" data-text-size="standard" data-reader-width="standard">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B1911" id="meta-theme-color">
  <meta name="description" content="Türkiye gerçekleri ve gelecek vizyonlu mega projeler üzerine kişisel makale ve araştırma arşivi.">
  <title>Arşiv &amp; Perspektif</title>

  <!-- Site Favicon (Parti Logosu ile Aynı) -->
  <link rel="icon" type="image/svg+xml" href="assets/images/logo-benimp.svg">

  <!-- İlk boyamada tema ve okuma tercihlerini yükle (varsayılan: green / yeşil) -->
  <script>
    (function () {
      var validThemes = { green: '#0B1911', dark: '#090A0D', light: '#F6F8F7', gray: '#222428' };
      var savedTheme = null;
      var savedSize = null;
      var savedWidth = null;
      try {
        savedTheme = localStorage.getItem('site-theme');
        savedSize = localStorage.getItem('reader-text-size');
        savedWidth = localStorage.getItem('reader-width');
      } catch (e) {}
      var theme = savedTheme && validThemes[savedTheme] ? savedTheme : 'green';
      var root = document.documentElement;
      root.dataset.theme = theme;
      if (savedSize === 'small' || savedSize === 'standard' || savedSize === 'large') {
        root.dataset.textSize = savedSize;
      }
      if (savedWidth === 'standard' || savedWidth === 'wide') {
        root.dataset.readerWidth = savedWidth;
      }
      var meta = document.getElementById('meta-theme-color');
      if (meta) meta.setAttribute('content', validThemes[theme]);
    })();
  </script>

  <!-- Google Fonts: Başlıklar için Lora, gövde metni için Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Ana Stil Dosyası -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Üst Navigasyon, Orta Parti Başlığı ve Sağ Üst Tema Seçici -->
  <header class="site-header">
    <div class="header-inner">
      <!-- Dinamik Kategori Navigasyonu (En Üst Sol) -->
      <nav id="site-nav" class="site-nav" aria-label="Ana menü"></nav>

      <!-- Üst Orta Başlık (Logo + Tıklanamaz Düz Yazı) -->
      <div class="header-center-brand">
        <img src="assets/images/logo-benimp.svg" alt="Birlik Emek Nizam İlerleme ve Mutluluk Partisi Logosu" class="header-party-logo" width="34" height="34">
        <span id="header-center-title" class="header-center-title">Birlik Emek Nizam İlerleme ve Mutluluk Partisi</span>
      </div>

      <!-- Sağ Üst Köşe Tema Seçici (Varsayılan: Yeşil) -->
      <div id="theme-switcher" class="theme-switcher" role="group" aria-label="Tema görünümü">
        <button type="button" class="theme-btn" data-theme-choice="green" aria-pressed="true" title="Yeşil tema (Varsayılan)">
          <span class="theme-swatch theme-swatch-green" aria-hidden="true"></span>
          <span>Yeşil</span>
        </button>
        <button type="button" class="theme-btn" data-theme-choice="dark" aria-pressed="false" title="Karanlık mod">
          <span class="theme-swatch theme-swatch-dark" aria-hidden="true"></span>
          <span>Karanlık</span>
        </button>
        <button type="button" class="theme-btn" data-theme-choice="light" aria-pressed="false" title="Parlak mod">
          <span class="theme-swatch theme-swatch-light" aria-hidden="true"></span>
          <span>Parlak</span>
        </button>
        <button type="button" class="theme-btn" data-theme-choice="gray" aria-pressed="false" title="Gri mod">
          <span class="theme-swatch theme-swatch-gray" aria-hidden="true"></span>
          <span>Gri</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Piyasa Kayan Bandı (Sitenin en üstünün bir altında) -->
  <div class="market-ticker-bar" aria-label="Canlı Piyasa Verileri">
    <script type="module" src="https://widgets.tradingview-widget.com/w/tr/tv-ticker-tape.js"></script>
    <tv-ticker-tape
      id="tv-market-ticker"
      symbols="FX:USDTRY,FX:EURTRY,FX:XAUUSD,FX_IDC:XAUTRYG,FX:EURUSD,BINANCE:BTCUSD,FX:UKOIL,FX:NGAS"
      theme="dark"
    ></tv-ticker-tape>
  </div>

  <!-- 3 Bölgeli Sayfa İskeleti: Sol Canlı Haber Akışı + Orta Ana İçerik + Sağ Türkiye İstatistik Widgetleri -->
  <div class="page-shell">
    <!-- Sol Taraf: Canlı RSS Haber Akışı -->
    <aside id="news-sidebar" class="news-sidebar" aria-label="Canlı Haber Akışı">
      <div class="rss-header">
        <div class="rss-title-row">
          <span class="rss-live-dot" aria-hidden="true"></span>
          <h2 class="rss-panel-title">Canlı Haber Akışı</h2>
        </div>
        <div class="rss-header-actions">
          <button type="button" id="rss-toggle-scroll" class="rss-ctrl-btn" aria-pressed="false" title="Akışı durdur veya başlat">Duraklat</button>
          <button type="button" id="rss-refresh-btn" class="rss-ctrl-btn" title="Haberleri yenile">Yenile</button>
        </div>
      </div>

      <div class="rss-controls">
        <label class="rss-filter-label" for="rss-filter-select">Kaynak / Kategori</label>
        <select id="rss-filter-select" class="rss-filter-select" aria-label="Haber kaynağı veya kategori filtresi">
          <option value="all">Yükleniyor...</option>
        </select>
        <p id="rss-status-text" class="rss-status-text">Kaynaklar hazırlanıyor...</p>
      </div>

      <div id="rss-feed-list" class="rss-feed-list" aria-live="off">
        <div class="rss-empty-state">
          <p>Canlı haber akışı yükleniyor...</p>
        </div>
      </div>
    </aside>

    <!-- Dinamik İçerik Alanı (SPA / Hash Router Çıktısı) -->
    <main id="app-root" class="site-main" aria-live="polite">
      <div class="container">
        <div class="loading-state" role="status">
          <span class="loading-spinner" aria-hidden="true"></span>
          <p>İçerikler hazırlanıyor...</p>
        </div>
      </div>
    </main>

    <!-- Sağ Taraf: Glostats Canlı Türkiye İstatistik Widgetleri -->
    <aside id="stats-sidebar" class="stats-sidebar" aria-label="Türkiye Canlı İstatistikleri">
      <div class="stats-widget-card">
        <iframe
          class="glostats-iframe"
          src="https://glostats.com/widget/counter.html?t=pop&amp;c=TUR&amp;lang=tr&amp;theme=dark"
          height="178"
          title="Türkiye canlı nüfusu — Glostats"
          loading="lazy"
        ></iframe>
        <p class="stats-widget-credit">
          <a href="https://glostats.com/tr/ulke/turkiye/" target="_blank" rel="noopener noreferrer">Türkiye nüfusu</a> — canlı veri: <a href="https://glostats.com/" target="_blank" rel="noopener noreferrer">Glostats</a>
        </p>
      </div>

      <div class="stats-widget-card">
        <iframe
          class="glostats-iframe"
          src="https://glostats.com/widget/counter.html?t=debt&amp;c=TUR&amp;lang=tr&amp;theme=dark"
          height="178"
          title="Türkiye: kamu borcu, canlı — Glostats"
          loading="lazy"
        ></iframe>
        <p class="stats-widget-credit">
          <a href="https://glostats.com/tr/borc/turkiye/" target="_blank" rel="noopener noreferrer">Türkiye: kamu borcu, canlı</a> — canlı veri: <a href="https://glostats.com/" target="_blank" rel="noopener noreferrer">Glostats</a>
        </p>
      </div>

      <!-- Makale Görünüm Paneli Yuvası (Yalnızca makale sayfalarında görünür) -->
      <div id="sidebar-appearance-slot" class="sidebar-appearance-slot" hidden></div>
    </aside>
  </div>

  <!-- Alt Bilgi (Footer): JSON'dan beslenen sosyal medya, karekodlar ve iletişim bilgileri -->
  <footer id="site-footer" class="site-footer"></footer>

  <!-- Büyütülebilir Karekod (QR) Modal Penceresi -->
  <div id="qr-modal" class="qr-modal" hidden role="dialog" aria-modal="true" aria-labelledby="qr-modal-title">
    <div class="qr-modal-backdrop" data-qr-close></div>
    <div class="qr-modal-card">
      <div class="qr-modal-header">
        <h3 id="qr-modal-title" class="qr-modal-title">Karekod</h3>
        <button type="button" class="qr-modal-close" id="qr-modal-close" aria-label="Pencereyi kapat">✕</button>
      </div>
      <div id="qr-modal-body" class="qr-modal-body"></div>
      <p id="qr-modal-value" class="qr-modal-value"></p>
      <div class="qr-modal-actions">
        <button type="button" id="qr-modal-copy" class="back-btn">Kopyala</button>
        <a id="qr-modal-download" class="back-btn" href="#" download="karekod.svg">SVG İndir</a>
      </div>
    </div>
  </div>

  <!-- Karekod Üreticisi, Canlı RSS Akışı & Uygulama Mantığı -->
  <script src="qr.js" defer></script>
  <script src="rss.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
